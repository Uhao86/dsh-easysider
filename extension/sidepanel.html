<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH 侧边栏</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.6c.4 4.6 2.8 7 7.4 7.4-4.6.4-7 2.8-7.4 7.4-.4-4.6-2.8-7-7.4-7.4 4.6-.4 7-2.8 7.4-7.4Z"/><path d="M18.6 15.2c.2 2.1 1.3 3.2 3.4 3.4-2.1.2-3.2 1.3-3.4 3.4-.2-2.1-1.3-3.2-3.4-3.4 2.1-.2 3.2-1.3 3.4-3.4Z" opacity=".55"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4.5V10h5.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></symbol>
      <symbol id="i-page" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5 9 17l10.5-10.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v5M12 17.2v.3"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8ZM12 17v4"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9S14.6 18.4 12 21c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3Z"/></symbol>
      <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9" /></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l1 8 3 3H5l3-3 1-8Z"/><path d="M12 14v6"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m14 6 4 4"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><path d="M3 5h18v4H3z"/><path d="M5 9v10h14V9"/><path d="M10 13h4"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13v6h16v-6"/><path d="m4 13 3-8h10l3 8"/><path d="M9 13h6"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo"><img src="icons/icon128.png" alt=""></span>
        <span class="brand-text">
          <span class="brand-title">DSH</span>
          <span class="brand-sub" id="brandSub">dsh web · Chrome</span>
        </span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnHistory" title="历史对话" aria-label="历史对话"><svg><use href="#i-history"/></svg></button>
        <button class="icon-btn" id="btnNew" title="新对话" aria-label="新对话"><svg><use href="#i-plus"/></svg></button>
        <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置"><svg><use href="#i-settings"/></svg></button>
      </div>
    </header>

    <div class="conn-bar" id="connBar" hidden>
      <span class="conn-dot" id="connDot"></span>
      <span class="conn-text" id="connText">未连接</span>
      <button class="link-btn" id="connAction">设置</button>
    </div>

    <section class="page-card" id="pageCard">
      <span class="favicon" id="pageFavicon">·</span>
      <div class="page-meta">
        <div class="page-title" id="pageTitle">正在读取当前标签页…</div>
        <div class="page-url" id="pageUrl"></div>
      </div>
      <span class="page-badge" id="pageBadge" hidden>已选文本</span>
    </section>

    <main class="chat" id="chat" aria-live="polite"></main>

    <footer class="composer-wrap">
      <div class="chips" id="chips" hidden></div>
      <div class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="问问这个页面，或让我去操作它…" spellcheck="false"></textarea>
        <div class="composer-row">
          <div class="toggles">
            <button class="toggle on" id="togglePage" title="附带当前页面正文"><svg><use href="#i-page"/></svg><span>页面</span></button>
            <button class="toggle" id="toggleShot" title="附带当前页面截图"><svg><use href="#i-camera"/></svg><span>截图</span></button>
            <label class="effort" title="思考强度">
              <svg><use href="#i-spark"/></svg>
              <select id="effort" aria-label="思考强度">
                <option value="auto">自动</option>
                <option value="off">快速</option>
                <option value="low">标准</option>
                <option value="high">深入</option>
                <option value="max">极限</option>
              </select>
            </label>
            <span class="ctx-state" id="ctxState"></span>
          </div>
          <div class="send-group">
            <button class="stop-btn" id="btnStop" title="停止" hidden><svg><use href="#i-stop"/></svg></button>
            <button class="send-btn" id="btnSend" disabled title="发送"><svg><use href="#i-send"/></svg></button>
          </div>
        </div>
      </div>
      <div class="foot-note"><span id="footModel">deepseek-flash</span> · Enter 发送 · Shift+Enter 换行</div>
    </footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <section class="sheet" id="sheetSettings" hidden aria-label="设置">
    <div class="sheet-head">
      <h2>设置</h2>
      <button class="icon-btn" data-close="sheetSettings" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="sheet-body">
      <label class="field">
        <span>Bridge 地址</span>
        <input id="setBridge" type="text" spellcheck="false" placeholder="http://127.0.0.1:8787">
      </label>
      <label class="field">
        <span>访问 Token</span>
        <input id="setToken" type="password" spellcheck="false" placeholder="从 bridge 终端或配对页复制">
      </label>
      <div class="field-row">
        <button class="btn secondary" id="btnPair">自动获取 Token</button>
        <button class="btn ghost" id="btnOpenLanding">打开配对页</button>
      </div>
      <div class="hint" id="setHint">先在终端运行 <code>./start</code>（本目录），再点“自动获取”。</div>
      <div class="field readonly">
        <span>模型</span>
        <div class="readonly-value" id="setModel">deepseek-flash</div>
      </div>
      <div class="field readonly">
        <span>会话</span>
        <div class="readonly-value mono" id="setSession">—</div>
      </div>
      <button class="btn primary" id="btnSaveSettings">保存并连接</button>
      <button class="btn ghost danger" id="btnReset">清空本机会话记录</button>
    </div>
  </section>

  <section class="sheet" id="sheetHistory" hidden aria-label="历史对话">
    <div class="sheet-head">
      <h2>历史对话</h2>
      <button class="icon-btn" data-close="sheetHistory" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="sheet-body">
      <button class="btn secondary" id="btnNewFromHistory"><svg class="btn-icon"><use href="#i-plus"/></svg>新对话</button>
      <div class="session-list" id="sessionList"></div>
      <p class="hint">对话保存在本机 DSH 会话目录，重启 bridge 后仍可继续。</p>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="markdown.js"></script>
  <script src="ui-render.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
